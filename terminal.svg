<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="860" height="542" viewBox="0 0 860 542" role="img" aria-labelledby="t d">
  <title id="t">cnasir's terminal</title>
  <desc id="d">Abdinasir Muhumed (cnasir), full-stack engineer who builds AI products end to end. Results, projects, what he's working on now, and his stack.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #39ff6a; white-space: pre; }
    .p { fill: #1fa84a; }
    .c { fill: #d7ffe0; }
    .m { fill: #22c55e; }
    .l { opacity: 1; animation: in .35s ease-out both; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="860" height="542" rx="10" fill="#0a0a0a"/>
  <rect width="860" height="34" rx="10" fill="#161616"/>
  <rect y="24" width="860" height="10" fill="#161616"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="6" fill="#febc2e"/>
  <circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="430" y="22" text-anchor="middle" class="p" style="font-size:12px">cnasir@dallas: ~</text>

  <g class="l" style="animation-delay:.2s"><text x="24" y="66"><tspan class="p">cnasir@dallas:~$</tspan><tspan class="c"> whoami</tspan></text></g>
  <g class="l" style="animation-delay:.6s"><text x="24" y="88">Abdinasir Muhumed (cnasir) · full-stack engineer who builds AI products end to end</text></g>

  <g class="l" style="animation-delay:1.1s"><text x="24" y="124"><tspan class="p">cnasir@dallas:~$</tspan><tspan class="c"> cat results.txt</tspan></text></g>
  <g class="l" style="animation-delay:1.5s"><text x="24" y="146"><tspan class="m">[ok]</tspan> replaced part of a $50K/yr vendor tool with React, DeckGL and Python</text></g>
  <g class="l" style="animation-delay:1.7s"><text x="24" y="168"><tspan class="m">[ok]</tspan> list pipeline froze at 6K rows; now handles 30K+ smoothly</text></g>
  <g class="l" style="animation-delay:1.9s"><text x="24" y="190"><tspan class="m">[ok]</tspan> Redux to Redux Toolkit across 100+ files, state bugs down 50%+</text></g>
  <g class="l" style="animation-delay:2.1s"><text x="24" y="212"><tspan class="m">[ok]</tspan> 65 teaching videos, 2,800+ views, and two written courses</text></g>
  <g class="l" style="animation-delay:2.3s"><text x="24" y="234"><tspan class="m">[ok]</tspan> open source: merged into PostHog, static cohorts from criteria (#53102)</text></g>

  <g class="l" style="animation-delay:2.6s"><text x="24" y="270"><tspan class="p">cnasir@dallas:~$</tspan><tspan class="c"> ls ~/projects</tspan></text></g>
  <g class="l" style="animation-delay:3.0s"><text x="24" y="292">prospecting-agent/<tspan x="214">AI research, scoring and outreach, a person in charge</tspan></text></g>
  <g class="l" style="animation-delay:3.15s"><text x="24" y="314">policyos/<tspan x="214">explainable policy decisions, audit log, MCP server</tspan></text></g>
  <g class="l" style="animation-delay:3.3s"><text x="24" y="336">agent-harness/<tspan x="214">an AI agent built by hand: loop, compaction, retrieval</tspan></text></g>
  <g class="l" style="animation-delay:3.45s"><text x="24" y="358">reverse-proxy/<tspan x="214">Go: atomic config swaps, canary routing, mTLS</tspan></text></g>
  <g class="l" style="animation-delay:3.6s"><text x="24" y="380">rate-limiter/<tspan x="214">Go: distributed, HTTP and gRPC, survives Redis failure</tspan></text></g>

  <g class="l" style="animation-delay:4.1s"><text x="24" y="416"><tspan class="p">cnasir@dallas:~$</tspan><tspan class="c"> tail now.log</tspan></text></g>
  <g class="l" style="animation-delay:4.5s"><text x="24" y="438"><tspan class="p">[nov 2026]</tspan> recording lesson 6 of the harness series: retrieval (RAG)</text></g>
  <g class="l" style="animation-delay:4.7s"><text x="24" y="460"><tspan class="p">[nov 2026]</tspan> shipped cnasir.dev, a 3D book in an artist's workshop</text></g>

  <g class="l" style="animation-delay:5.2s"><text x="24" y="496"><tspan class="p">cnasir@dallas:~$</tspan><tspan class="c"> echo $STACK</tspan></text></g>
  <g class="l" style="animation-delay:5.6s"><text x="24" y="518">typescript react next.js python fastapi go postgres sqlite docker mcp <tspan class="cur">█</tspan></text></g>
</svg>
